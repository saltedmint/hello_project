<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Type · 발표자 관리</title><style>body{background:#080808;color:#ddd;font:15px/1.8 system-ui;max-width:760px;padding:32px 20px;margin:auto}button,input{font:inherit;background:#151515;color:#ddd;border:1px solid #666;padding:9px;margin:5px}label{display:block}a{color:#bbb}pre{white-space:pre-wrap;font:13px/1.7 system-ui}section{margin:30px 0;border-top:1px solid #333;padding-top:20px}</style><script src="admin.js" defer></script></head><body><h1>Your Type · 발표자 관리</h1><p>서버가 확인한 발표자 계정만 관리할 수 있습니다. 관객은 로그인 없이 체험합니다.</p><a href="/signin-with-chatgpt?returnTo=%2Fadmin" target="_top">발표자 계정으로 로그인</a> · <a href="/">관객 화면</a><pre id="status" role="status">권한 확인 중…</pre><div id="tools" hidden><section><h2>발표 회차</h2><p>새로 시작하는 관객부터 적용합니다. 이미 시작한 체험은 기존 회차로 저장합니다.</p><label>회차 ID <input id="round" placeholder="presentation-2026"></label><label>제목 <input id="title" placeholder="Your Type"></label><button id="switch">이 회차로 전환</button><pre id="rounds"></pre></section><section><h2>발표용 합성 데이터</h2><p>현재 회차의 10인 배치만 추가·삭제합니다. 실제 기록과 별도 저장됩니다. 반복 추가해도 중복되지 않습니다.</p><button id="seed">10명·30답변 추가</button><button id="remove-demo">이 배치만 삭제</button></section><section><h2>기록 보관·삭제</h2><button id="export">전체 회차 JSON 내보내기</button><label>삭제할 회차 ID <input id="delete-round"></label><label>삭제할 세션 ID <input id="delete-id"></label><button id="remove-one">지정 기록 삭제</button><p>다운로드에는 비공개 답변 원문과 수정 로그가 포함됩니다. 안전한 장소에 보관하세요.</p></section></div></body></html>
